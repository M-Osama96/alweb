<style>
  * {
    box-sizing: border-box;
    margin: 0;
    padding: 0;
  }

  body {
    background: #ffffff;
    font-family: Arial, Helvetica, sans-serif;
    padding: 140px 20px;
  }

  .shimmer {
    position: relative;
    overflow: hidden;
    background-color: #d1d5db;
  }

  .shimmer::after {
    content: "";
    position: absolute;
    top: 0;
    left: -150%;
    height: 100%;
    width: 150%;
    background: linear-gradient(
      90deg,
      rgba(255, 255, 255, 0) 0%,
      rgba(255, 255, 255, 0.6) 50%,
      rgba(255, 255, 255, 0) 100%
    );
    animation: shimmer 1.6s infinite;
  }

  @keyframes shimmer {
    0% {
      left: -150%;
    }
    100% {
      left: 150%;
    }
  }

  .wrap {
    max-width: 1140px;
    margin: 0 auto;
  }

  /* Top area: heading + image + folded stat card */
  .top-area {
    position: relative;
  }

  .heading-block {
    max-width: 68%;
    margin-bottom: 40px;
  }

  .heading-line {
    height: 30px;
    border-radius: 8px;
    background-color: #9ca3af;
    margin-bottom: 14px;
  }

  .heading-line.w1 {
    width: 96%;
  }
  .heading-line.w2 {
    width: 100%;
  }
  .heading-line.w3 {
    width: 92%;
  }
  .heading-line.w4 {
    width: 60%;
    margin-bottom: 0;
  }

  .image-banner {
    width: 100%;
    height: 300px;
    border-radius: 4px;
    background-color: #9ca3af;
  }

  .stat-card {
    position: absolute;
    right: 0;
    top: 8%;
    width: 23.8%;
    height: 41.6%;
    background-color: #f9fafb;
    border: 1px solid #d1d5db;
    clip-path: polygon(0% 0%, 82% 0%, 100% 18%, 100% 100%, 0% 100%);
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    gap: 16px;
  }

  .fold-flap {
    position: absolute;
    top: 0;
    right: 0;
    width: 18%;
    height: 18%;
    background: linear-gradient(135deg, #e5e7eb 50%, transparent 50%);
  }

  .stat-number {
    width: 60px;
    height: 34px;
    border-radius: 8px;
    background-color: #9ca3af;
  }

  .stat-label {
    width: 55%;
    height: 14px;
    border-radius: 6px;
    background-color: #6b7280;
  }

  /* Bottom area: paragraph + button */
  .bottom-area {
    display: flex;
    justify-content: space-between;
    align-items: flex-start;
    margin-top: 30px;
    gap: 30px;
  }

  .paragraph-block {
    flex: 1;
    max-width: 68%;
  }

  .body-line {
    height: 12px;
    border-radius: 6px;
    background-color: #d1d5db;
    margin-bottom: 10px;
  }

  .body-line.full {
    width: 100%;
  }
  .body-line.last {
    width: 30%;
    margin-bottom: 0;
  }

  .button-skeleton {
    width: 23.8%;
    min-width: 260px;
    height: 95px;
    border-radius: 8px;
    border: 2px solid #9ca3af;
    background-color: #6b7280;
    display: flex;
    align-items: center;
    justify-content: center;
    gap: 14px;
  }

  .button-text {
    width: 110px;
    height: 15px;
    border-radius: 6px;
    background-color: #9ca3af;
  }

  .button-arrow {
    width: 22px;
    height: 22px;
    border-radius: 4px;
    background-color: #9ca3af;
  }

  @media (max-width: 900px) {
    .heading-block {
      max-width: 100%;
    }
    .stat-card {
      position: static;
      width: 200px;
      height: 160px;
      margin: 20px 0;
    }
    .bottom-area {
      flex-direction: column;
    }
    .paragraph-block {
      max-width: 100%;
    }
    .button-skeleton {
      width: 100%;
    }
  }
</style>
<div class="wrap">
  <div class="top-area">
    <div class="heading-block">
      <div class="heading-line w1 shimmer"></div>
      <div class="heading-line w2 shimmer"></div>
      <div class="heading-line w3 shimmer"></div>
      <div class="heading-line w4 shimmer"></div>
    </div>

    <div class="image-banner shimmer"></div>

    <div class="stat-card">
      <div class="fold-flap"></div>
      <div class="stat-number shimmer"></div>
      <div class="stat-label shimmer"></div>
    </div>
  </div>

  <div class="bottom-area">
    <div class="paragraph-block">
      <div class="body-line full shimmer"></div>
      <div class="body-line full shimmer"></div>
      <div class="body-line full shimmer"></div>
      <div class="body-line full shimmer"></div>
      <div class="body-line full shimmer"></div>
      <div class="body-line last shimmer"></div>
    </div>

    <div class="button-skeleton">
      <div class="button-text shimmer"></div>
      <div class="button-arrow shimmer"></div>
    </div>
  </div>
</div>
