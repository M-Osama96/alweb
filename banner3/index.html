<!doctype html>
<html dir="rtl" lang="ar">
  <head>
    <meta charset="UTF-8" />
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1, shrink-to-fit=no, user-scalable=no"
    />
    <title>banner3</title>
    <link rel="shortcut icon" type="img/png" href="images/favicon.png" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Vazirmatn:wght@100..900&display=swap"
      rel="stylesheet"
    />
    <link
      rel="stylesheet"
      href="https://cdn.jsdelivr.net/npm/swiper@11/swiper-bundle.min.css"
    />
    <link
      href="https://cdn.jsdelivr.net/npm/line-awesome@1.3.0/dist/line-awesome/css/line-awesome.min.css
    "
      rel="stylesheet"
    />
    <link
      rel="stylesheet"
      href="https://cdn.jsdelivr.net/npm/@fancyapps/ui@6.0/dist/fancybox/fancybox.css"
    />
    <link rel="stylesheet" href="css/main.css" />
  </head>

  <body>
    <section class="banner">
      <div class="section-svg">
        <svg
          viewBox="0 0 1440 768"
          width="100%"
          height="100%"
          preserveAspectRatio="none"
          xmlns="http://www.w3.org/2000/svg"
        >
          <rect
            width="100%"
            height="100%"
            fill="url(#paint0_linear_7514_1251)"
          />

          <defs>
            <linearGradient
              id="paint0_linear_7514_1251"
              x1="0"
              y1="0"
              x2="1440"
              y2="768"
              gradientUnits="userSpaceOnUse"
            >
              <stop class="color1" offset="0" stop-color="currentColor" />
              <stop class="color2" offset="1" stop-color="currentColor" />
            </linearGradient>
          </defs>
        </svg>
      </div>

      <div class="container">
        <div class="banner-cont">
          <div class="cont-svg">
            <img src="images/cont-svg.png" class="img-contain" alt="" />
          </div>
          <div class="banner-grid">
            <div class="banner-info">
              <h3 class="title">
                اهتم بشراء سيارتك الأمنة وتقسيط بخصومات تصل إلي 10%
              </h3>
              <p class="desc">
                استكشف مجموعتنا المختارة بعناية من المنتجات التي تجمع بين الجودة
                العالية والتصميم العصري لتلبي احتاجك
              </p>
              <a href="#" class="banner-btn">تواصل معنا</a>
            </div>
            <div class="banner-imgs">
              <div class="first-img">
                <img src="images/banner.jpg" class="img-cover" alt="" />
              </div>
              <div class="second-img">
                <img src="images/banner2.jpg" class="img-cover" alt="" />
              </div>
              <div class="third-img">
                <img src="images/banner3.jpg" class="img-cover" alt="" />
              </div>
            </div>
          </div>
        </div>
      </div>
    </section>

    <script src="https://cdn.jsdelivr.net/npm/swiper@11/swiper-bundle.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/@fancyapps/ui@6.0/dist/fancybox/fancybox.umd.js"></script>

    <script src="js/main.js"></script>
  </body>
</html>
