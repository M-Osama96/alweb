<!doctype html>
<html dir="rtl" lang="ar">
  <head>
    <meta charset="UTF-8" />
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1, shrink-to-fit=no, user-scalable=no"
    />
    <title>banner6</title>
    <link rel="shortcut icon" type="img/png" href="images/favicon.png" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Vazirmatn:wght@100..900&display=swap"
      rel="stylesheet"
    />
    <link
      rel="stylesheet"
      href="https://cdn.jsdelivr.net/npm/swiper@11/swiper-bundle.min.css"
    />
    <link
      href="https://cdn.jsdelivr.net/npm/line-awesome@1.3.0/dist/line-awesome/css/line-awesome.min.css
    "
      rel="stylesheet"
    />
    <link
      rel="stylesheet"
      href="https://cdn.jsdelivr.net/npm/@fancyapps/ui@6.0/dist/fancybox/fancybox.css"
    />
    <link rel="stylesheet" href="css/main.css" />
  </head>

  <body>
    <section class="banner">
      <div class="container">
        <div class="banner-cont">
          <div class="discount">
            <div class="d-text">خصم على كل المنتجات</div>
            <div class="d-per">30%</div>
          </div>
          <div class="star-svg">
            <svg
              width="142"
              height="164"
              viewBox="0 0 142 164"
              fill="none"
              xmlns="http://www.w3.org/2000/svg"
            >
              <path
                d="M70.93 0C71.0268 37.0061 95.8109 69.3969 131.504 79.1658L141.86 82L131.504 84.8342C95.8109 94.6031 71.0268 126.994 70.93 164C70.8332 126.994 46.0491 94.6031 10.3556 84.8342L0 82L10.3556 79.1658C46.0491 69.3969 70.8332 37.0061 70.93 0Z"
                fill="white"
              />
            </svg>
          </div>
          <div class="banner-info">
            <h3 class="title">
              اهتم بشراء سيارتك الأمنة وتقسيط بخصومات تصل إلي 10%
            </h3>
            <p class="desc">
              استكشف مجموعتنا المختارة بعناية من المنتجات التي تجمع بين الجودة
              العالية والتصميم العصري لتلبي احتاجك
            </p>
            <a href="#" class="banner-btn">تواصل معنا</a>
          </div>
          <div class="banner-imgs">
            <div class="first-img">
              <img src="images/banner.jpg" class="img-cover" alt="" />
            </div>
          </div>
        </div>
      </div>
    </section>

    <script src="https://cdn.jsdelivr.net/npm/swiper@11/swiper-bundle.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/@fancyapps/ui@6.0/dist/fancybox/fancybox.umd.js"></script>

    <script src="js/main.js"></script>
  </body>
</html>
