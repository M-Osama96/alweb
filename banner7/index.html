<!doctype html>
<html dir="rtl" lang="ar">
  <head>
    <meta charset="UTF-8" />
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1, shrink-to-fit=no, user-scalable=no"
    />
    <title>banner7</title>
    <link rel="shortcut icon" type="img/png" href="images/favicon.png" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Vazirmatn:wght@100..900&display=swap"
      rel="stylesheet"
    />
    <link
      rel="stylesheet"
      href="https://cdn.jsdelivr.net/npm/swiper@11/swiper-bundle.min.css"
    />
    <link
      href="https://cdn.jsdelivr.net/npm/line-awesome@1.3.0/dist/line-awesome/css/line-awesome.min.css
    "
      rel="stylesheet"
    />

  <body>
    <section class="banner">
      <div class="container">
        <div class="banner-cont">
          <div class="discount">
            <div class="d-text">خصم على كل المنتجات</div>
            <div class="d-per">30%</div>
          </div>

          <div class="banner-info">
            <h3 class="title">اهتم بشراء وحدتك الأمنة وتقسيط بخصومات تصل</h3>

            <a href="#" class="banner-btn">تواصل معنا</a>
          </div>
          <div class="banner-imgs"></div>
        </div>
      </div>
      <div class="banner-svg">
        <img src="images/Group 873.png" class="img-cover" alt="" />
      </div>
      <div class="first-img">
        <img src="images/banner.jpg" class="img-cover" alt="" />
      </div>
    </section>

    <script src="https://cdn.jsdelivr.net/npm/swiper@11/swiper-bundle.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/@fancyapps/ui@6.0/dist/fancybox/fancybox.umd.js"></script>

    <script src="js/main.js"></script>
  </body>
