<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Skeleton Loading - Clients Grid</title>
<style>
  * { box-sizing: border-box; margin: 0; padding: 0; }

  body {
    background: #f3f4f6;
    font-family: Arial, Helvetica, sans-serif;
    padding: 60px 20px;
  }

  .shimmer {
    position: relative;
    overflow: hidden;
    background-color: #d1d5db;
  }

  .shimmer::after {
    content: "";
    position: absolute;
    top: 0;
    left: -150%;
    height: 100%;
    width: 150%;
    background: linear-gradient(
      90deg,
      rgba(255, 255, 255, 0) 0%,
      rgba(255, 255, 255, 0.6) 50%,
      rgba(255, 255, 255, 0) 100%
    );
    animation: shimmer 1.6s infinite;
  }

  @keyframes shimmer {
    0%   { left: -150%; }
    100% { left: 150%; }
  }

  .page-title {
    width: 160px;
    height: 44px;
    border-radius: 8px;
    margin: 0 auto 20px auto;
    background-color: #9ca3af;
  }

  .subtitle-line {
    width: 320px;
    height: 18px;
    border-radius: 6px;
    margin: 0 auto 50px auto;
    background-color: #d1d5db;
  }

  .grid-card {
    max-width: 1400px;
    margin: 0 auto;
    background: #ffffff;
    border-radius: 24px;
    box-shadow: 0 4px 16px rgba(0,0,0,0.06);
    overflow: hidden;
  }

  .logo-grid {
    display: grid;
    grid-template-columns: repeat(6, 1fr);
    gap: 1px;
    background-color: #e5e7eb;
  }

  .logo-cell {
    background-color: #d1d5db;
    aspect-ratio: 220 / 145;
  }

  @media (max-width: 1000px) {
    .logo-grid { grid-template-columns: repeat(3, 1fr); }
  }

  @media (max-width: 600px) {
    .logo-grid { grid-template-columns: repeat(2, 1fr); }
  }
</style>
</head>
<body>

  <div class="page-title shimmer"></div>
  <div class="subtitle-line shimmer"></div>

  <div class="grid-card">
    <div class="logo-grid">
      <div class="logo-cell shimmer"></div>
      <div class="logo-cell shimmer"></div>
      <div class="logo-cell shimmer"></div>
      <div class="logo-cell shimmer"></div>
      <div class="logo-cell shimmer"></div>
      <div class="logo-cell shimmer"></div>

      <div class="logo-cell shimmer"></div>
      <div class="logo-cell shimmer"></div>
      <div class="logo-cell shimmer"></div>
      <div class="logo-cell shimmer"></div>
      <div class="logo-cell shimmer"></div>
      <div class="logo-cell shimmer"></div>

      <div class="logo-cell shimmer"></div>
      <div class="logo-cell shimmer"></div>
      <div class="logo-cell shimmer"></div>
      <div class="logo-cell shimmer"></div>
      <div class="logo-cell shimmer"></div>
      <div class="logo-cell shimmer"></div>
    </div>
  </div>

</body>
</html>
