<!doctype html>
<html dir="rtl" lang="ar">
  <head>
    <meta charset="UTF-8" />
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1, shrink-to-fit=no, user-scalable=no"
    />
    <title>hero</title>
    <link rel="shortcut icon" type="img/png" href="images/favicon.png" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Vazirmatn:wght@100..900&display=swap"
      rel="stylesheet"
    />
    <link
      rel="stylesheet"
      href="https://cdn.jsdelivr.net/npm/swiper@11/swiper-bundle.min.css"
    />
    <link
      href="https://cdn.jsdelivr.net/npm/line-awesome@1.3.0/dist/line-awesome/css/line-awesome.min.css
    "
      rel="stylesheet"
    />
    <link
      rel="stylesheet"
      href="https://cdn.jsdelivr.net/npm/@fancyapps/ui@6.0/dist/fancybox/fancybox.css"
    />
    <link rel="stylesheet" href="css/main.css" />
  </head>

  <body>
    <section class="hero">
      <div class="container">
        <div class="hero-cont">
          <div class="hero-info-cont">
            <div class="hero-info">
              <div class="badge">
                <i class="las la-shield-alt"></i>
                <span class="badge-text"> رعاية طبية موثوقة </span>
              </div>
              <h3 class="title">رعايتك الصحية</h3>
              <h5 class="start">تبدأ من هنا</h5>
              <div class="desc">
                نقدم لك ولعائلتك رعاية طبية موثوقة بأحدث التقنيات وكادر طبي
                متخصص.
              </div>
              <div class="hero-btns">
                <a href="#" class="about-btn"
                  ><i class="las la-calendar"></i>احجز موعدك الان
                </a>
                <a href="#" class="contact-btn">اتصل بنا</a>
              </div>
            </div>
            <div class="features">
              <div class="item">
                <i class="las la-shield-alt"></i>
                <span class="text"> آمن وموثوق </span>
              </div>
              <div class="item">
                <i class="las la-user-friends"></i>
                <span class="text"> فريق طبي متخصص </span>
              </div>
              <div class="item">
                <i class="las la-clock"></i>
                <span class="text"> مواعيد مرنة </span>
              </div>
              <div class="item">
                <i class="las la-star"></i>
                <span class="text"> جودة في الرعاية </span>
              </div>
            </div>
          </div>

          <div class="hero-img">
            <img
              src="images/ChatGPT Image Jul 22, 2026, 10_11_28 PM.png"
              class="img-cover"
              alt=""
            />
          </div>
        </div>
      </div>
    </section>

    <script src="https://cdn.jsdelivr.net/npm/swiper@11/swiper-bundle.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/@fancyapps/ui@6.0/dist/fancybox/fancybox.umd.js"></script>

    <script src="js/main.js"></script>
  </body>
</html>
