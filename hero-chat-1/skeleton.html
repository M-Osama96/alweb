<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<title>Skeleton Loading - Hero RTL</title>
<style>
  * { box-sizing: border-box; margin: 0; padding: 0; }

  body {
    background: #ffffff;
    font-family: Arial, Helvetica, sans-serif;
    padding: 60px 40px;
    overflow-x: hidden;
    position: relative;
  }

  .shimmer {
    position: relative;
    overflow: hidden;
    background-color: #d1d5db;
  }

  .shimmer::after {
    content: "";
    position: absolute;
    top: 0;
    left: -150%;
    height: 100%;
    width: 150%;
    background: linear-gradient(
      90deg,
      rgba(255, 255, 255, 0) 0%,
      rgba(255, 255, 255, 0.6) 50%,
      rgba(255, 255, 255, 0) 100%
    );
    animation: shimmer 1.6s infinite;
  }

  @keyframes shimmer {
    0%   { left: -150%; }
    100% { left: 150%; }
  }

  /* Decorative background wave */
  .bg-wave {
    position: absolute;
    left: 0;
    bottom: -40px;
    width: 45%;
    height: 220px;
    background-color: #f3f4f6;
    border-radius: 0 100% 0 0;
    z-index: -1;
  }

  .hero-row {
    display: flex;
    align-items: center;
    gap: 70px;
    max-width: 1650px;
    margin: 0 auto;
  }

  /* Image */
  .image-skeleton {
    width: 685px;
    max-width: 45%;
    height: 520px;
    border-radius: 24px;
    background-color: #9ca3af;
  }

  /* Content column */
  .content-col {
    flex: 1;
    display: flex;
    flex-direction: column;
    align-items: flex-end;
  }

  .badge {
    display: flex;
    align-items: center;
    gap: 10px;
    width: 230px;
    height: 44px;
    border-radius: 999px;
    background-color: #f3f4f6;
    padding: 0 18px;
    margin-bottom: 26px;
    justify-content: flex-end;
  }

  .badge-text {
    width: 130px;
    height: 12px;
    border-radius: 6px;
    background-color: #9ca3af;
  }

  .badge-icon {
    width: 18px;
    height: 18px;
    min-width: 18px;
    border-radius: 4px;
    background-color: #9ca3af;
  }

  .heading-line {
    height: 46px;
    border-radius: 10px;
    background-color: #111827;
    margin-bottom: 16px;
  }

  .heading-line.w1 { width: 260px; }
  .heading-line.w2 { width: 320px; background-color: #6b7280; margin-bottom: 24px; }

  .body-block {
    display: flex;
    flex-direction: column;
    align-items: flex-end;
    margin-bottom: 30px;
  }

  .body-line {
    height: 13px;
    border-radius: 6px;
    background-color: #d1d5db;
    margin-bottom: 10px;
  }

  .body-line.w1 { width: 420px; }
  .body-line.w2 { width: 400px; }
  .body-line.w3 { width: 200px; margin-bottom: 0; }

  .button-row {
    display: flex;
    gap: 16px;
    margin-bottom: 40px;
  }

  .btn-outline {
    width: 250px;
    height: 58px;
    border-radius: 999px;
    border: 2px solid #9ca3af;
  }

  .btn-filled {
    width: 250px;
    height: 58px;
    border-radius: 999px;
    background-color: #6b7280;
    display: flex;
    align-items: center;
    justify-content: center;
    gap: 12px;
  }

  .btn-filled-text {
    width: 130px;
    height: 12px;
    border-radius: 6px;
    background-color: #9ca3af;
  }

  .btn-filled-icon {
    width: 20px;
    height: 20px;
    border-radius: 4px;
    background-color: #9ca3af;
  }

  /* Feature icons row */
  .features-row {
    display: flex;
    width: 100%;
    justify-content: flex-end;
    gap: 0;
  }

  .feature-item {
    display: flex;
    flex-direction: column;
    align-items: center;
    gap: 12px;
    padding: 0 26px;
    border-left: 1px solid #e5e7eb;
  }

  .feature-item:last-child {
    border-left: none;
  }

  .feature-icon {
    width: 40px;
    height: 40px;
    border-radius: 50%;
    border: 2px solid #9ca3af;
  }

  .feature-label {
    width: 70px;
    height: 11px;
    border-radius: 5px;
    background-color: #d1d5db;
  }

  @media (max-width: 1100px) {
    .hero-row { flex-direction: column; }
    .image-skeleton { width: 100%; max-width: 100%; height: 400px; }
    .content-col { align-items: flex-end; width: 100%; }
    .features-row { flex-wrap: wrap; justify-content: center; }
  }
</style>
</head>
<body>

  <div class="bg-wave"></div>

  <div class="hero-row">

    <div class="image-skeleton shimmer"></div>

    <div class="content-col">
      <div class="badge">
        <div class="badge-text shimmer"></div>
        <div class="badge-icon shimmer"></div>
      </div>

      <div class="heading-line w1 shimmer"></div>
      <div class="heading-line w2 shimmer"></div>

      <div class="body-block">
        <div class="body-line w1 shimmer"></div>
        <div class="body-line w2 shimmer"></div>
        <div class="body-line w3 shimmer"></div>
      </div>

      <div class="button-row">
        <div class="btn-outline shimmer"></div>
        <div class="btn-filled">
          <div class="btn-filled-text shimmer"></div>
          <div class="btn-filled-icon shimmer"></div>
        </div>
      </div>

      <div class="features-row">
        <div class="feature-item">
          <div class="feature-icon shimmer"></div>
          <div class="feature-label shimmer"></div>
        </div>
        <div class="feature-item">
          <div class="feature-icon shimmer"></div>
          <div class="feature-label shimmer"></div>
        </div>
        <div class="feature-item">
          <div class="feature-icon shimmer"></div>
          <div class="feature-label shimmer"></div>
        </div>
        <div class="feature-item">
          <div class="feature-icon shimmer"></div>
          <div class="feature-label shimmer"></div>
        </div>
      </div>
    </div>

  </div>

</body>
</html>
