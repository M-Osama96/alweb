<style>
  .sk-wrap * { box-sizing: border-box; margin: 0; padding: 0; }

  .sk-wrap {
    font-family: Arial, Helvetica, sans-serif;
    background: #f7f7f8;
    padding: 60px 40px;
  }

  .sk-shimmer {
    position: relative;
    overflow: hidden;
    background: linear-gradient(135deg, #d1d5db 0%, #9ca3af 100%);
  }

  .sk-shimmer::after {
    content: "";
    position: absolute;
    top: 0;
    left: -150%;
    height: 100%;
    width: 150%;
    background: linear-gradient(
      90deg,
      rgba(255, 255, 255, 0) 0%,
      rgba(255, 255, 255, 0.55) 50%,
      rgba(255, 255, 255, 0) 100%
    );
    animation: sk-shimmer-move 1.6s infinite;
  }

  @keyframes sk-shimmer-move {
    0%   { left: -150%; }
    100% { left: 150%; }
  }

  .sk-hero-row {
    display: flex;
    align-items: center;
    justify-content: space-between;
    max-width: 1280px;
    margin: 0 auto;
    gap: 40px;
  }

  /* Left content */
  .sk-content-col {
    max-width: 500px;
  }

  .sk-eyebrow-line {
    width: 220px;
    height: 34px;
    border-radius: 8px;
    margin-bottom: 12px;
    background: linear-gradient(90deg, #9ca3af 0%, #6b7280 100%);
  }

  .sk-heading-line {
    width: 260px;
    height: 42px;
    border-radius: 9px;
    margin-bottom: 18px;
    background: linear-gradient(90deg, #4b5563 0%, #1f2937 100%);
  }

  .sk-underline {
    width: 100px;
    height: 4px;
    border-radius: 2px;
    background-color: #9ca3af;
    margin-bottom: 26px;
  }

  .sk-body-block {
    margin-bottom: 30px;
  }

  .sk-body-line {
    height: 14px;
    border-radius: 6px;
    background: linear-gradient(90deg, #d1d5db 0%, #e5e7eb 100%);
    margin-bottom: 10px;
  }

  .sk-body-line.sk-w1 { width: 440px; max-width: 100%; }
  .sk-body-line.sk-w2 { width: 260px; margin-bottom: 0; }

  .sk-button-row {
    display: flex;
    gap: 16px;
  }

  .sk-btn-filled {
    display: flex;
    align-items: center;
    gap: 12px;
    width: 285px;
    height: 60px;
    border-radius: 999px;
    padding: 0 22px;
    background: linear-gradient(90deg, #6b7280 0%, #4b5563 100%);
  }

  .sk-btn-outline {
    display: flex;
    align-items: center;
    gap: 12px;
    width: 285px;
    height: 60px;
    border-radius: 999px;
    padding: 0 22px;
    border: 2px solid #9ca3af;
    background: #f7f7f8;
  }

  .sk-btn-icon {
    width: 22px;
    height: 22px;
    min-width: 22px;
    border-radius: 50%;
    background-color: #d1d5db;
  }

  .sk-btn-outline .sk-btn-icon {
    background-color: #9ca3af;
  }

  .sk-btn-text {
    width: 150px;
    height: 12px;
    border-radius: 6px;
    background-color: #d1d5db;
  }

  .sk-btn-outline .sk-btn-text {
    background-color: #9ca3af;
  }

  /* Right visual: circles */
  .sk-visual-col {
    position: relative;
    width: 500px;
    height: 500px;
    min-width: 400px;
  }

  .sk-circle-main {
    position: absolute;
    left: 0;
    top: 8%;
    width: 84%;
    height: 84%;
    border-radius: 50%;
    border: 6px solid #ffffff;
    background: linear-gradient(160deg, #9ca3af 0%, #4b5563 100%);
  }

  .sk-circle-small-1 {
    position: absolute;
    right: 0;
    top: 0;
    width: 19%;
    height: 19%;
    border-radius: 50%;
    border: 5px solid #ffffff;
    background: linear-gradient(160deg, #cbd5e1 0%, #9ca3af 100%);
  }

  .sk-circle-small-2 {
    position: absolute;
    right: 3%;
    bottom: 0;
    width: 17%;
    height: 17%;
    border-radius: 50%;
    border: 5px solid #ffffff;
    background: linear-gradient(160deg, #d1d5db 0%, #6b7280 100%);
  }

  @media (max-width: 1000px) {
    .sk-hero-row { flex-direction: column; }
    .sk-visual-col { width: 100%; min-width: 0; height: 380px; }
  }
</style>

<div class="sk-wrap">
  <div class="sk-hero-row">

    <div class="sk-content-col">
      <div class="sk-eyebrow-line sk-shimmer"></div>
      <div class="sk-heading-line sk-shimmer"></div>
      <div class="sk-underline"></div>

      <div class="sk-body-block">
        <div class="sk-body-line sk-w1 sk-shimmer"></div>
        <div class="sk-body-line sk-w2 sk-shimmer"></div>
      </div>

      <div class="sk-button-row">
        <div class="sk-btn-filled">
          <div class="sk-btn-icon sk-shimmer"></div>
          <div class="sk-btn-text sk-shimmer"></div>
        </div>
        <div class="sk-btn-outline">
          <div class="sk-btn-icon sk-shimmer"></div>
          <div class="sk-btn-text sk-shimmer"></div>
        </div>
      </div>
    </div>

    <div class="sk-visual-col">
      <div class="sk-circle-main sk-shimmer"></div>
      <div class="sk-circle-small-1 sk-shimmer"></div>
      <div class="sk-circle-small-2 sk-shimmer"></div>
    </div>

  </div>
</div>
