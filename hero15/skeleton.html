<style>
  *,
  *::before,
  *::after {
    box-sizing: border-box;
    border: none;
    margin: 0;
    padding: 0;
  }
  :root {
    --sk-dir: -1;
  }

  .sk-wrap {
    width: 100%;
    min-height: 640px;
    background: #d1d5db;
    display: grid;
    grid-template-columns: 1fr 1fr;
    align-items: center;
    padding: 48px 40px;
    gap: 140px;
    direction: rtl;
  }

  .sk-shimmer {
    position: relative;
    overflow: hidden;
    background: #b0b8c4;
    border-radius: 6px;
  }
  .sk-shimmer::after {
    content: "";
    position: absolute;
    inset: 0;
    transform: translateX(calc(-100% * var(--sk-dir)));
    background: linear-gradient(
      90deg,
      transparent,
      rgba(255, 255, 255, 0.4),
      transparent
    );
    animation: skshimmer 1.5s infinite;
  }
  @keyframes skshimmer {
    100% {
      transform: translateX(calc(100% * var(--sk-dir)));
    }
  }

  /* ── RIGHT (text) — appears first in RTL ── */
  .sk-right {
    display: flex;
    flex-direction: column;
    gap: 20px;
    align-items: flex-end;
  }
  .sk-title-1 {
    height: 3em;
    width: 85%;
    border-radius: 6px;
  }
  .sk-title-2 {
    height: 3em;
    width: 55%;
    border-radius: 6px;
  }
  .sk-body {
    display: flex;
    flex-direction: column;
    gap: 10px;
    width: 100%;
  }
  .sk-body .sk-line {
    height: 13px;
    border-radius: 4px;
  }
  .sk-body .sk-line:nth-child(1) {
    width: 95%;
  }
  .sk-body .sk-line:nth-child(2) {
    width: 100%;
  }
  .sk-body .sk-line:nth-child(3) {
    width: 98%;
  }
  .sk-body .sk-line:nth-child(4) {
    width: 60%;
  }
  .sk-btn {
    height: 52px;
    width: 200px;
    border-radius: 8px;
  }

  /* ── LEFT (image + nav) ── */
  .sk-left {
    display: flex;
    flex-direction: column;
    gap: 24px;
  }
  .sk-img {
    width: 100%;
    aspect-ratio: 4/3;
    border-radius: 6px;
  }

  /* nav row */
  .sk-nav {
    display: flex;
    align-items: center;
    justify-content: space-between;
    gap: 12px;
  }
  .sk-arrow {
    width: 52px;
    height: 52px;
    border-radius: 50%;
    flex-shrink: 0;
  }
  .sk-thumb {
    width: 72px;
    height: 52px;
    border-radius: 6px;
    flex-shrink: 0;
  }
  .sk-thumb-active {
    background: #9ca3af;
    border: 2px solid #6b7280;
  }
  .sk-arrow-r {
    width: 52px;
    height: 52px;
    border-radius: 50%;
    flex-shrink: 0;
  }

  @media (max-width: 768px) {
    .sk-wrap {
      grid-template-columns: 1fr;
      direction: rtl;
      padding: 32px 20px;
    }
    .sk-nav {
      flex-wrap: wrap;
    }
  }
</style>

<div class="sk-wrap">
  <!-- RIGHT: text -->
  <div class="sk-right">
    <div class="sk-title-1 sk-shimmer"></div>
    <div class="sk-title-2 sk-shimmer"></div>
    <div class="sk-body">
      <div class="sk-line sk-shimmer"></div>
      <div class="sk-line sk-shimmer"></div>
      <div class="sk-line sk-shimmer"></div>
      <div class="sk-line sk-shimmer"></div>
    </div>
    <div class="sk-btn sk-shimmer"></div>
  </div>

  <!-- LEFT: image + nav -->
  <div class="sk-left">
    <div class="sk-img sk-shimmer"></div>
    <div class="sk-nav">
      <div class="sk-arrow sk-shimmer"></div>
      <div class="sk-thumb sk-shimmer"></div>
      <div class="sk-thumb sk-shimmer"></div>
      <div class="sk-thumb sk-shimmer"></div>
      <div class="sk-thumb sk-thumb-active sk-shimmer"></div>
      <div class="sk-arrow-r sk-shimmer"></div>
    </div>
  </div>
</div>
