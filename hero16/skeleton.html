<section class="skeleton-wrapper sk-hero">
  <div class="sk-hero-bg skeleton-shimmer">
    <div class="sk-hero-content">
      <div class="sk-line sk-hero-title skeleton-shimmer"></div>
      <div class="sk-line sk-hero-title sk-hero-title-2 skeleton-shimmer"></div>
      <div class="sk-line sk-hero-sub skeleton-shimmer"></div>
      <div class="sk-line sk-hero-sub sk-hero-sub-2 skeleton-shimmer"></div>
      <div class="sk-hero-btns">
        <div class="sk-hero-btn sk-hero-btn-sm skeleton-shimmer"></div>
        <div class="sk-hero-btn sk-hero-btn-lg skeleton-shimmer"></div>
      </div>
      <div class="sk-hero-stats">
        <div class="sk-hero-stat skeleton-shimmer">
          <div class="sk-line sk-stat-num skeleton-shimmer"></div>
          <div class="sk-line sk-stat-label skeleton-shimmer"></div>
        </div>
        <div class="sk-hero-stat skeleton-shimmer">
          <div class="sk-line sk-stat-num skeleton-shimmer"></div>
          <div class="sk-line sk-stat-label skeleton-shimmer"></div>
        </div>
        <div class="sk-hero-stat skeleton-shimmer">
          <div class="sk-line sk-stat-num skeleton-shimmer"></div>
          <div class="sk-line sk-stat-label skeleton-shimmer"></div>
        </div>
        <div class="sk-hero-stat skeleton-shimmer">
          <div class="sk-line sk-stat-num skeleton-shimmer"></div>
          <div class="sk-line sk-stat-label skeleton-shimmer"></div>
        </div>
        <div class="sk-hero-stat skeleton-shimmer">
          <div class="sk-line sk-stat-num skeleton-shimmer"></div>
          <div class="sk-line sk-stat-label skeleton-shimmer"></div>
        </div>
      </div>
    </div>
  </div>
</section>
<style>
  .skeleton-wrapper.sk-hero {
    padding-block: 0;
  }
  .sk-hero-bg {
    width: 100%;
    min-height: 820px;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    position: relative;
    padding-block: 100px 70px;
    padding-inline: 60px;
  }
  .sk-hero-content {
    display: flex;
    flex-direction: column;
    align-items: center;
    gap: 18px;
    width: 100%;
    max-width: 1180px;
  }
  .sk-hero-title {
    height: 2.2em;
    width: 90%;
    border-radius: 6px;
  }
  .sk-hero-title-2 {
    width: 55%;
    margin-block-end: 8px;
  }
  .sk-hero-sub {
    height: 14px;
    width: 68%;
    border-radius: 4px;
  }
  .sk-hero-sub-2 {
    width: 50%;
    margin-block-end: 12px;
  }
  .sk-hero-btns {
    display: flex;
    gap: 16px;
    align-items: center;
    margin-block: 8px 40px;
  }
  .sk-hero-btn {
    height: 56px;
    border-radius: 14px;
  }
  .sk-hero-btn-sm {
    width: 130px;
  }
  .sk-hero-btn-lg {
    width: 170px;
  }
  .sk-hero-stats {
    display: grid;
    grid-template-columns: repeat(5, 1fr);
    gap: 20px;
    width: 100%;
  }
  .sk-hero-stat {
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    gap: 14px;
    border-radius: 16px;
    padding: 36px 16px;
    min-height: 150px;
  }
  .sk-stat-num {
    height: 1.8em;
    width: 55%;
    border-radius: 6px;
  }
  .sk-stat-label {
    height: 12px;
    width: 45%;
    border-radius: 4px;
  }
  @media (max-width: 900px) {
    .sk-hero-stats {
      grid-template-columns: repeat(3, 1fr);
    }
  }
  @media (max-width: 600px) {
    .sk-hero-bg {
      min-height: auto;
      padding-block: 70px 40px;
    }
    .sk-hero-title {
      width: 100%;
      height: 1.8em;
    }
    .sk-hero-title-2 {
      width: 75%;
    }
    .sk-hero-sub {
      width: 90%;
    }
    .sk-hero-sub-2 {
      width: 70%;
    }
    .sk-hero-stats {
      grid-template-columns: repeat(2, 1fr);
    }
  }
</style>
<style>
  *,
  :before,
  :after {
    box-sizing: border-box;
    border: none;
    margin: 0;
  }
  :root {
    --sk-shimmer-dir: 1;
  }
  [dir="rtl"] {
    --sk-shimmer-dir: -1;
  }
  .skeleton-wrapper {
    height: fit-content;
    padding-block: 100px;
    width: 100%;
  }
  .skeleton-wrapper.sk-full-bg {
    background: rgba(229, 231, 235, 0.45);
  }
  .skeleton-wrapper.sk-hero {
    padding-block: 0;
  }
  .skeleton-wrapper.sk-header {
    padding-block: 0;
  }
  .skeleton-wrapper.sk-strip {
    padding-block: 60px;
  }
  .skeleton-wrapper.sk-footer {
    padding-block: 60px 0;
  }
  .skeleton-container {
    padding-inline: 20px;
    margin-inline: auto;
    width: 100%;
    max-width: 1180px;
  }
  .skeleton-shimmer {
    position: relative;
    overflow: hidden;
    background: #aaaaaa;
  }
  .skeleton-shimmer::after {
    content: "";
    position: absolute;
    inset: 0;
    transform: translateX(calc(-100% * var(--sk-shimmer-dir)));
    background: linear-gradient(
      90deg,
      transparent,
      rgba(255, 255, 255, 0.5),
      transparent
    );
    animation: skeleton-shimmer-animation 1.5s infinite;
  }
  @keyframes skeleton-shimmer-animation {
    100% {
      transform: translateX(calc(100% * var(--sk-shimmer-dir)));
    }
  }
</style>
