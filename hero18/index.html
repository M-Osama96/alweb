<!doctype html>
<html dir="rtl" lang="ar">
  <head>
    <meta charset="UTF-8" />
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1, shrink-to-fit=no, user-scalable=no"
    />
    <title>hero18</title>
    <link rel="shortcut icon" type="img/png" href="images/favicon.png" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Vazirmatn:wght@100..900&display=swap"
      rel="stylesheet"
    />
    <link
      rel="stylesheet"
      href="https://cdn.jsdelivr.net/npm/swiper@11/swiper-bundle.min.css"
    />
    <link
      href="https://cdn.jsdelivr.net/npm/line-awesome@1.3.0/dist/line-awesome/css/line-awesome.min.css"
      rel="stylesheet"
    />
    <link
      rel="stylesheet"
      href="https://cdn.jsdelivr.net/npm/@fancyapps/ui@6.0/dist/fancybox/fancybox.css"
    />
    <link rel="stylesheet" href="css/main.css" />
  </head>

  <body>
    <section class="hero18">
      <div class="hero-bg">
        <img src="images/hero.jpg" class="img-cover" alt="Hero Background" />
        <div class="bg-overlay"></div>
      </div>

      <div class="container">
        <div class="hero-body-inner">
          <!-- Floating Dark Glass Card -->
          <div class="hero-glass-card">
            <div class="card-badge">
              <span class="badge-dot"></span>
              <span>شركة تصميم وبرمجة</span>
            </div>

            <h1 class="hero-card-title">
              نحن شركة برمجة نصنع الفارق لأجل مستقبل مزدهر نتقدم للأمام
            </h1>

            <p class="hero-card-desc">
              خلافاً للإعتقاد السائد فإن لوريم إيبسوم ليس نصا عشوائياً، بل إن له
              جذور في الأدب اللاتيني الكلاسيكي منذ العام 45 قبل الميلاد، مما
              يجعله أكثر من 2000 خلافاً
            </p>

            <!-- Inner Stats Grid inside card -->
            <div class="card-stats-row">
              <div class="stat-item">
                <h4 class="stat-val">+18</h4>
                <span class="stat-lbl">مشروع متكامل</span>
              </div>
              <div class="stat-item">
                <h4 class="stat-val">+45</h4>
                <span class="stat-lbl">جائزة معمارية</span>
              </div>
              <div class="stat-item">
                <h4 class="stat-val">+23</h4>
                <span class="stat-lbl">سنة خبرة</span>
              </div>
            </div>
          </div>
        </div>
      </div>

      <div class="scroll-down-wrapper">
        <div class="scroll-notch">
          <a href="#" class="scroll-mouse-btn" aria-label="Scroll Down">
            <span class="mouse-pill">
              <span class="mouse-dot"></span>
            </span>
            <i class="la la-angle-down scroll-arrow"></i>
          </a>
        </div>
      </div>

      <svg
        class="bottom-svg"
        xmlns="http://www.w3.org/2000/svg"
        viewBox="0 0 1440 80"
        preserveAspectRatio="none"
      >
        <path
          fill="#fff"
          d="
      M0 0
      H615
      C665 0 685 50 720 50
      C755 50 775 0 825 0
      H1440
      V80
      H0
      Z
  "
        />
      </svg>
    </section>

    <script src="https://cdn.jsdelivr.net/npm/swiper@11/swiper-bundle.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/@fancyapps/ui@6.0/dist/fancybox/fancybox.umd.js"></script>

    <script src="js/main.js"></script>
  </body>
</html>
