<!DOCTYPE html>
<html dir="rtl" lang="ar">
  <head>
    <meta charset="UTF-8" />
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1, shrink-to-fit=no, user-scalable=no"
    />
    <title>hero4</title>
    <link rel="shortcut icon" type="img/png" href="images/favicon.png" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Vazirmatn:wght@100..900&display=swap"
      rel="stylesheet"
    />
    <link
      rel="stylesheet"
      href="https://cdn.jsdelivr.net/npm/swiper@11/swiper-bundle.min.css"
    />
    <link
      href="https://cdn.jsdelivr.net/npm/line-awesome@1.3.0/dist/line-awesome/css/line-awesome.min.css
    "
      rel="stylesheet"
    />
    <link
      rel="stylesheet"
      href="https://cdn.jsdelivr.net/npm/@fancyapps/ui@6.0/dist/fancybox/fancybox.css"
    />
    <link rel="stylesheet" href="css/main.css" />
  </head>

  <body>
    <section class="hero4">
      <div class="container">
        <div class="hero4-cont">
          <h3 class="hero4-title">
            ريفيرا لايف: أفضل مستشفى علاج إدمان لحياة جديدة بلا قيود
          </h3>
          <p class="hero4-desc">
            خلافاَ للإعتقاد السائد فإن لوريم إيبسوم ليس نصاَ عشوائياً، بل إن له
            جذور في الأدب اللاتيني الكلاسيكي منذ العام 45 قبل الميلاد، مما يجعله
            أكثر من 2000 .
          </p>
          <div class="hero4-btns">
            <a href="#" class="more-btn"> عن الشركة</a>
          </div>
        </div>
      </div>
      <div class="hero4-swipers">
        <div class="swiper hero4-swiper">
          <div class="swiper-wrapper">
            <div class="swiper-slide">
              <div class="hero4-slide">
                <img src="images/banner1.png" class="img-cover" />
              </div>
            </div>
            <div class="swiper-slide">
              <div class="hero4-slide">
                <img src="images/banner1.png" class="img-cover" />
              </div>
            </div>
            <div class="swiper-slide">
              <div class="hero4-slide">
                <img src="images/banner1.png" class="img-cover" />
              </div>
            </div>
            <div class="swiper-slide">
              <div class="hero4-slide">
                <img src="images/banner1.png" class="img-cover" />
              </div>
            </div>
          </div>
        </div>
        <div class="swiper thumbs-swiper">
          <div class="swiper-wrapper">
            <div class="swiper-slide">
              <div class="hero-thmb-slide">
                <span class="slide-num">01</span>
                <img src="images/banner1.png" class="img-cover" />
              </div>
            </div>
            <div class="swiper-slide">
              <div class="hero-thmb-slide">
                <span class="slide-num">02</span>
                <img src="images/banner1.png" class="img-cover" />
              </div>
            </div>
            <div class="swiper-slide">
              <div class="hero-thmb-slide">
                <span class="slide-num">03</span>
                <img src="images/banner1.png" class="img-cover" />
              </div>
            </div>
            <div class="swiper-slide">
              <div class="hero-thmb-slide">
                <span class="slide-num">04</span>
                <img src="images/banner1.png" class="img-cover" />
              </div>
            </div>
          </div>
        </div>
      </div>
    </section>

    <script src="https://cdn.jsdelivr.net/npm/swiper@11/swiper-bundle.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/@fancyapps/ui@6.0/dist/fancybox/fancybox.umd.js"></script>

    <script src="js/main.js"></script>
  </body>
</html>
