<!DOCTYPE html>
<html dir="rtl" lang="ar">
  <head>
    <meta charset="UTF-8" />
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1, shrink-to-fit=no, user-scalable=no"
    />
    <title>map 1</title>
    <link rel="shortcut icon" type="img/png" href="images/favicon.png" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Vazirmatn:wght@100..900&display=swap"
      rel="stylesheet"
    />
    <link
      rel="stylesheet"
      href="https://cdn.jsdelivr.net/npm/swiper@11/swiper-bundle.min.css"
    />
    <link
      href="https://cdn.jsdelivr.net/npm/line-awesome@1.3.0/dist/line-awesome/css/line-awesome.min.css
    "
      rel="stylesheet"
    />
    <link
      rel="stylesheet"
      href="https://cdn.jsdelivr.net/npm/@fancyapps/ui@6.0/dist/fancybox/fancybox.css"
    />
    <link rel="stylesheet" href="css/main.css" />
  </head>

  <body>
    <section class="map-1">
      <div class="container">
        <div class="tabs">
          <div class="map-1-tabs">
            <h3>موقعنا على الخريطة</h3>
            <div role="tablist" aria-label="maps">
              <button role="tab" aria-selected="true" id="map1">
                الفرع الأول
              </button>
              <button role="tab" aria-selected="false" id="map2">
                الفرع الثاني
              </button>
              <button role="tab" aria-selected="false" id="map3">
                الفرع الثالث
              </button>
            </div>
          </div>
          <div class="map-tappanel">
            <div role="tabpanel" aria-labelledby="map1">
              <iframe
                src="https://maps.google.com/maps?q=%D8%A7%D9%84%D8%B1%D9%8A%D8%A7%D8%B6&t=&z=13&ie=UTF8&iwloc=&output=embed"
                frameborder="0"
              ></iframe>
            </div>
            <div role="tabpanel" aria-labelledby="map2" hidden>
              <iframe
                src="https://maps.google.com/maps?q=%D8%AF%D8%A8%D9%8A&t=&z=13&ie=UTF8&iwloc=&output=embed"
                frameborder="0"
              ></iframe>
            </div>
            <div role="tabpanel" aria-labelledby="map3" hidden>
              <iframe
                src="https://maps.google.com/maps?q=%D8%A7%D9%84%D9%82%D8%A7%D9%87%D8%B1%D8%A9&t=&z=13&ie=UTF8&iwloc=&output=embed"
                frameborder="0"
              ></iframe>
            </div>
          </div>
        </div>
      </div>
    </section>

    <script src="js/main.js"></script>
  </body>
</html>
