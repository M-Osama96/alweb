<!doctype html>
<html dir="rtl" lang="ar">
  <head>
    <meta charset="UTF-8" />
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1, shrink-to-fit=no, user-scalable=no"
    />
    <title>offers_04</title>
    <link rel="shortcut icon" type="img/png" href="images/favicon.png" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Vazirmatn:wght@100..900&display=swap"
      rel="stylesheet"
    />
    <link
      rel="stylesheet"
      href="https://cdn.jsdelivr.net/npm/swiper@11/swiper-bundle.min.css"
    />
    <link
      href="https://cdn.jsdelivr.net/npm/line-awesome@1.3.0/dist/line-awesome/css/line-awesome.min.css
    "
      rel="stylesheet"
    />
    <link
      rel="stylesheet"
      href="https://cdn.jsdelivr.net/npm/@fancyapps/ui@6.0/dist/fancybox/fancybox.css"
    />
    <link rel="stylesheet" href="css/main.css" />
  </head>

  <body>
    <section class="offers">
      <div class="container">
        <div class="offers-cont">
          <h3 class="title">عروض البيت</h3>
          <p class="desc">
            يتم وضع اسم وسم مختصر هنا بشكل واضح على سطرين ان امكن للمستخدم
          </p>
          <div class="offers-grid">
            <a href="#" class="offers-item">
              <div class="discount">25%</div>
              <h5 class="item-title">
                عروضنا على منتجات الاثاث المنزلي الراقي لكامل العفش
              </h5>
              <div class="price">
                <span class="start-with">تبدأ من</span>
                <strong class="num">7000</strong>
              </div>
              <div class="item-img">
                <img src="images/services3.jpg" class="img-cover" alt="" />
              </div>
            </a>
            <a href="#" class="offers-item">
              <div class="discount">25%</div>
              <h5 class="item-title">
                تخفيضات الشتاء على كل البناطيل الجينز اولادي وشبابي
              </h5>
              <div class="price">
                <span class="start-with">تبدأ من</span>
                <strong class="num">7000</strong>
              </div>
              <div class="item-img">
                <img src="images/services3.jpg" class="img-cover" alt="" />
              </div>
            </a>
          </div>
        </div>
      </div>
    </section>
    <script src="https://cdn.jsdelivr.net/npm/swiper@11/swiper-bundle.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/@fancyapps/ui@6.0/dist/fancybox/fancybox.umd.js"></script>

    <script src="js/main.js"></script>
  </body>
