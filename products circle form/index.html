<!DOCTYPE html>
<html dir="rtl" lang="ar">
  <head>
    <meta charset="UTF-8" />
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1, shrink-to-fit=no, user-scalable=no"
    />
    <title>product circle form</title>
    <link rel="shortcut icon" type="img/png" href="images/favicon.png" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Vazirmatn:wght@100..900&display=swap"
      rel="stylesheet"
    />
    <link
      rel="stylesheet"
      href="https://cdn.jsdelivr.net/npm/swiper@11/swiper-bundle.min.css"
    />
    <link
      href="https://cdn.jsdelivr.net/npm/line-awesome@1.3.0/dist/line-awesome/css/line-awesome.min.css
    "
      rel="stylesheet"
    />
    <link
      rel="stylesheet"
      href="https://cdn.jsdelivr.net/npm/@fancyapps/ui@6.0/dist/fancybox/fancybox.css"
    />
    <link rel="stylesheet" href="css/main.css" />
  </head>

  <body>
    <section class="products-circle-form">
      <div class="container">
        <div class="products-form-cont">
          <div class="inner-cont">
            <div class="product-img">
              <img src="images/product.png" class="img-cover" alt="" />
            </div>
            <div class="form">
              <form>
                <h3 class="form-title">لطلب المنتج يسعدنا تواصلكم معنا</h3>
                <div class="form-row">
                  <div class="form-group">
                    <input type="text" id="name" placeholder=" " required />
                    <label for="name">الاسم</label>
                  </div>
                  <div class="form-group">
                    <input type="email" id="email" placeholder=" " required />
                    <label for="email">البريد الإلكتروني</label>
                  </div>
                </div>
                <div class="form-row">
                  <div class="form-group">
                    <input type="tel" id="tel" placeholder=" " required />
                    <label for="tel">الجوال</label>
                  </div>
                  <div class="select">
                    <select id="gender" required>
                      <option value="" disabled selected>نوعية الرسالة</option>
                      <option value="">option1</option>
                      <option value="">option2</option>
                    </select>
                  </div>
                </div>

                <textarea
                  id="message"
                  placeholder="الرسالة"
                  required
                ></textarea>
                <button type="submit">
                  <span class="send">ارسال </span>
                  <i class="las la-arrow-left"></i>
                </button>
              </form>
            </div>
          </div>
        </div>
      </div>
    </section>

    <script src="https://cdn.jsdelivr.net/npm/swiper@11/swiper-bundle.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/@fancyapps/ui@6.0/dist/fancybox/fancybox.umd.js"></script>

    <script src="js/main.js"></script>
  </body>
</html>
