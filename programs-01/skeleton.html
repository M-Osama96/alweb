<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Skeleton Loading - Card Grid</title>
<style>
  * { box-sizing: border-box; margin: 0; padding: 0; }

  body {
    background: #f3f4f6;
    font-family: Arial, Helvetica, sans-serif;
    padding: 60px 20px;
  }

  .shimmer {
    position: relative;
    overflow: hidden;
    background: #e5e7eb;
  }

  .shimmer::after {
    content: "";
    position: absolute;
    top: 0;
    left: -150%;
    height: 100%;
    width: 150%;
    background: linear-gradient(
      90deg,
      rgba(255, 255, 255, 0) 0%,
      rgba(255, 255, 255, 0.55) 50%,
      rgba(255, 255, 255, 0) 100%
    );
    animation: shimmer 1.6s infinite;
  }

  @keyframes shimmer {
    0%   { left: -150%; }
    100% { left: 150%; }
  }

  /* Page title */
  .page-title {
    width: 220px;
    height: 44px;
    border-radius: 8px;
    margin: 0 auto 50px auto;
    background-color: #d1d5db;
  }

  /* Card grid */
  .card-grid {
    display: grid;
    grid-template-columns: repeat(3, 1fr);
    gap: 24px;
    max-width: 1400px;
    margin: 0 auto;
  }

  .card {
    background: #ffffff;
    border-radius: 16px;
    padding: 16px;
    box-shadow: 0 2px 8px rgba(0, 0, 0, 0.06);
  }

  .card-image {
    width: 100%;
    height: 260px;
    border-radius: 10px;
    background-color: #d1d5db;
    margin-bottom: 20px;
  }

  .line {
    border-radius: 6px;
    background-color: #d1d5db;
  }

  .title-line {
    height: 20px;
    margin-bottom: 10px;
  }

  .title-line.w1 { width: 90%; }
  .title-line.w2 { width: 60%; }

  .desc-line {
    height: 12px;
    margin-bottom: 8px;
    background-color: #e5e7eb;
  }

  .desc-line.w1 { width: 100%; }
  .desc-line.w2 { width: 96%; }
  .desc-line.w3 { width: 40%; }

  .desc-block {
    margin-top: 18px;
    margin-bottom: 20px;
  }

  /* Meta box */
  .meta-box {
    background-color: #f3f4f6;
    border-radius: 10px;
    padding: 16px 18px;
  }

  .meta-row {
    display: flex;
    align-items: center;
    gap: 12px;
  }

  .meta-row + .meta-row {
    margin-top: 16px;
  }

  .icon-circle {
    width: 20px;
    height: 20px;
    min-width: 20px;
    border-radius: 50%;
    background-color: #9ca3af;
  }

  .meta-text {
    height: 12px;
    border-radius: 6px;
    background-color: #9ca3af;
  }

  .meta-text.w1 { width: 45%; }
  .meta-text.w2 { width: 30%; }

  /* Button */
  .button-wrap {
    display: flex;
    justify-content: center;
    margin-top: 50px;
  }

  .button-skeleton {
    width: 200px;
    height: 52px;
    border-radius: 999px;
    background-color: #d1d5db;
    border: 2px solid #e5e7eb;
  }

  @media (max-width: 900px) {
    .card-grid {
      grid-template-columns: 1fr;
    }
  }
</style>
</head>
<body>

  <div class="page-title shimmer"></div>

  <div class="card-grid">

    <div class="card">
      <div class="card-image shimmer"></div>
      <div class="title-line w1 shimmer"></div>
      <div class="title-line w2 shimmer"></div>
      <div class="desc-block">
        <div class="desc-line w1 shimmer"></div>
        <div class="desc-line w2 shimmer"></div>
        <div class="desc-line w3 shimmer"></div>
      </div>
      <div class="meta-box">
        <div class="meta-row">
          <div class="icon-circle shimmer"></div>
          <div class="meta-text w1 shimmer"></div>
        </div>
        <div class="meta-row">
          <div class="icon-circle shimmer"></div>
          <div class="meta-text w2 shimmer"></div>
        </div>
      </div>
    </div>

    <div class="card">
      <div class="card-image shimmer"></div>
      <div class="title-line w1 shimmer"></div>
      <div class="title-line w2 shimmer"></div>
      <div class="desc-block">
        <div class="desc-line w1 shimmer"></div>
        <div class="desc-line w2 shimmer"></div>
        <div class="desc-line w3 shimmer"></div>
      </div>
      <div class="meta-box">
        <div class="meta-row">
          <div class="icon-circle shimmer"></div>
          <div class="meta-text w1 shimmer"></div>
        </div>
        <div class="meta-row">
          <div class="icon-circle shimmer"></div>
          <div class="meta-text w2 shimmer"></div>
        </div>
      </div>
    </div>

    <div class="card">
      <div class="card-image shimmer"></div>
      <div class="title-line w1 shimmer"></div>
      <div class="title-line w2 shimmer"></div>
      <div class="desc-block">
        <div class="desc-line w1 shimmer"></div>
        <div class="desc-line w2 shimmer"></div>
        <div class="desc-line w3 shimmer"></div>
      </div>
      <div class="meta-box">
        <div class="meta-row">
          <div class="icon-circle shimmer"></div>
          <div class="meta-text w1 shimmer"></div>
        </div>
        <div class="meta-row">
          <div class="icon-circle shimmer"></div>
          <div class="meta-text w2 shimmer"></div>
        </div>
      </div>
    </div>

  </div>

  <div class="button-wrap">
    <div class="button-skeleton shimmer"></div>
  </div>

</body>
</html>
