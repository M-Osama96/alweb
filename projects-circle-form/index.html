<!DOCTYPE html>
<html dir="rtl" lang="ar">
  <head>
    <meta charset="UTF-8" />
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1, shrink-to-fit=no, user-scalable=no"
    />
    <title>projects single</title>
    <link rel="shortcut icon" type="img/png" href="images/favicon.png" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Vazirmatn:wght@100..900&display=swap"
      rel="stylesheet"
    />
    <link
      rel="stylesheet"
      href="https://cdn.jsdelivr.net/npm/swiper@11/swiper-bundle.min.css"
    />
    <link
      href="https://cdn.jsdelivr.net/npm/line-awesome@1.3.0/dist/line-awesome/css/line-awesome.min.css
    "
      rel="stylesheet"
    />
    <link
      rel="stylesheet"
      href="https://cdn.jsdelivr.net/npm/@fancyapps/ui@6.0/dist/fancybox/fancybox.css"
    />
    <link rel="stylesheet" href="css/main.css" />
  </head>

  <body>
    <section class="projects-circl1-form">
      <div class="container">
        <div class="projects-circl1-form-cont">
          <div class="form-cont">
            <div class="form-title">طلب المشروع</div>
            <form>
              <div class="form-group">
                <input type="text" id="name" placeholder=" " required />
                <label for="name">الاسم</label>
              </div>
              <div class="form-group">
                <input type="email" id="email" placeholder=" " required />
                <label for="email">البريد الإلكتروني</label>
              </div>
              <div class="form-group">
                <input type="tel" id="tel" placeholder=" " required />
                <label for="tel">الجوال</label>
              </div>
              <textarea id="message" placeholder="الرسالة" required></textarea>
              <button type="submit">
                <div class="send">
                  <a href="#">ارسال </a>
                </div>
              </button>
            </form>
          </div>
          <div class="form-video">
            <img src="images/project img.jpg" class="img-cover" alt="" />
            <a
              data-fancybox="gallery"
              href="https://www.youtube.com/watch?v=VP3c8ExvOP0"
              class="play-icon"
            >
              <i class="las la-play"></i>
            </a>
          </div>
        </div>
      </div>
    </section>

    <script src="https://cdn.jsdelivr.net/npm/swiper@11/swiper-bundle.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/@fancyapps/ui@6.0/dist/fancybox/fancybox.umd.js"></script>

    <script src="js/main.js"></script>
  </body>
</html>
