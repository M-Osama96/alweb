<!doctype html>
<html dir="rtl" lang="ar">
  <head>
    <meta charset="UTF-8" />
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1, shrink-to-fit=no, user-scalable=no"
    />
    <title>services semi circle form4</title>
    <link rel="shortcut icon" type="img/png" href="images/favicon.png" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Vazirmatn:wght@100..900&display=swap"
      rel="stylesheet"
    />
    <link
      rel="stylesheet"
      href="https://cdn.jsdelivr.net/npm/swiper@11/swiper-bundle.min.css"
    />
    <link
      href="https://cdn.jsdelivr.net/npm/line-awesome@1.3.0/dist/line-awesome/css/line-awesome.min.css
    "
      rel="stylesheet"
    />
    <link
      rel="stylesheet"
      href="https://cdn.jsdelivr.net/npm/@fancyapps/ui@6.0/dist/fancybox/fancybox.css"
    />
    <link rel="stylesheet" href="css/main.css" />
  </head>

  <body>
    <section class="services-semicircle-form">
      <div class="container">
        <div class="services-semicircle-cont">
          <div class="services-form-cont">
            <div class="title">اختر خدمتك بعناية وتمتع بالجودة والإتقان</div>
            <div class="form-cont">
              <form>
                <div class="form-grid">
                  <div class="form-group">
                    <input
                      class="form-control"
                      type="text"
                      id="name"
                      placeholder=" "
                      required
                    />
                    <label class="form-label" for="name">الاسم</label>
                  </div>
                  <div class="form-group">
                    <input
                      class="form-control"
                      type="email"
                      id="email"
                      placeholder=" "
                      required
                    />
                    <label class="form-label" for="email"
                      >البريد الإلكتروني</label
                    >
                  </div>
                  <div class="form-group">
                    <input
                      class="form-control"
                      type="tel"
                      id="tel"
                      placeholder=" "
                      required
                    />
                    <label class="form-label" for="tel">الجوال</label>
                  </div>
                  <div class="select-wrapper">
                    <select id="gender" class="select" required>
                      <option value="" disabled selected>القسم</option>
                      <option class="option" value="">1</option>
                      <option class="option" value="">2</option>
                    </select>
                  </div>

                  <textarea
                    class="textarea form-control"
                    id="message"
                    placeholder="الرسالة"
                    required
                  ></textarea>
                  <button class="form-btn" type="submit">ارســـال</button>
                </div>
              </form>
            </div>
          </div>
        </div>
      </div>
    </section>

    <script src="https://cdn.jsdelivr.net/npm/swiper@11/swiper-bundle.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/@fancyapps/ui@6.0/dist/fancybox/fancybox.umd.js"></script>

    <script src="js/main.js"></script>
  </body>
</html>
