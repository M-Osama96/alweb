<!doctype html>
<html dir="rtl" lang="ar">
  <head>
    <meta charset="UTF-8" />
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1, shrink-to-fit=no, user-scalable=no"
    />
    <title>staticsic_03</title>
    <link rel="shortcut icon" type="img/png" href="images/favicon.png" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Vazirmatn:wght@100..900&display=swap"
      rel="stylesheet"
    />
    <link
      rel="stylesheet"
      href="https://cdn.jsdelivr.net/npm/swiper@11/swiper-bundle.min.css"
    />
    <link
      href="https://cdn.jsdelivr.net/npm/line-awesome@1.3.0/dist/line-awesome/css/line-awesome.min.css
    "
      rel="stylesheet"
    />
    <link
      rel="stylesheet"
      href="https://cdn.jsdelivr.net/npm/@fancyapps/ui@6.0/dist/fancybox/fancybox.css"
    />
    <link rel="stylesheet" href="css/main.css" />
  </head>

  <body>
    <section class="staticsic">
      <div class="container">
        <div class="staticsic-cont">
          <div class="info">
            <h3 class="title">أرقام وإنجازات</h3>
            <p class="desc">
              بعناية من المنتجات التي تجمع بين الجودة العالية والتصميم العصري
              لتلبي جميع احتياجاتك استكشف مجموعتنا المختارة بعناية من المنتجات
            </p>
          </div>
          <div class="staticsic-grid">
            <div class="staticsic-item">
              <h4 class="num">4.8</h4>
              <div class="icon-plus-type">
                <span class="type-text"> تقييم عملاء</span>
                <i class="las la-star"></i>
              </div>
            </div>
            <div class="staticsic-item">
              <h4 class="num">5,678</h4>
              <div class="icon-plus-type">
                <span class="type-text">منتجات مباعة </span>
                <i class="las la-cube"></i>
              </div>
            </div>
            <div class="staticsic-item">
              <h4 class="num">142.254</h4>
              <div class="icon-plus-type">
                <span class="type-text">مشاهدات المنتج </span>
                <i class="las la-eye"></i>
              </div>
            </div>
            <div class="staticsic-item">
              <h4 class="num">15.214</h4>
              <div class="icon-plus-type">
                <span class="type-text"> مستخدم فعال</span>
                <i class="las la-wave-square"></i>
              </div>
            </div>
          </div>
        </div>
      </div>
    </section>
    <script src="https://cdn.jsdelivr.net/npm/swiper@11/swiper-bundle.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/@fancyapps/ui@6.0/dist/fancybox/fancybox.umd.js"></script>

    <script src="js/main.js"></script>
  </body>
</html>
